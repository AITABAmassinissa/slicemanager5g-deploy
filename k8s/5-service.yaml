apiVersion: v1
kind: Service
metadata:
  name: slice-manager
  namespace: slicemanager
  labels:
    app: slice-manager
spec:
  type: NodePort
  selector:
    app: slice-manager
  ports:
    - name: web
      port: 8080
      targetPort: 8080
      nodePort: 30880   # accès via http://<node-ip>:30880
